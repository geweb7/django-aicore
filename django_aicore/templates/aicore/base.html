{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AI{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
  <link href="{% static 'aicore/vendor/bootstrap.min.css' %}" rel="stylesheet">
  <link href="{% static 'aicore/vendor/bootstrap-icons.min.css' %}" rel="stylesheet">
  {% block extra_css %}{% endblock %}
</head>
<body class="bg-light">

<nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
  <div class="container">
    <span class="navbar-brand fw-semibold">🤖 AI</span>
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link {% if request.resolver_match.url_name == 'providers' or 'provider' in request.resolver_match.url_name %}active{% endif %}"
           href="{% url 'aicore:providers' %}">Провайдеры</a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% if request.resolver_match.url_name == 'tasks' or request.resolver_match.url_name == 'task_save' or request.resolver_match.url_name == 'task_delete' %}active{% endif %}"
           href="{% url 'aicore:tasks' %}">Задачи</a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% if 'prox' in request.resolver_match.url_name %}active{% endif %}"
           href="{% url 'aicore:proxies' %}">Прокси</a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% if 'calls' in request.resolver_match.url_name %}active{% endif %}"
           href="{% url 'aicore:calls' %}">Журнал</a>
      </li>
    </ul>
  </div>
</nav>

<div class="container pb-4">
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endif %}

  {% block content %}{% endblock %}
</div>

<script src="{% static 'aicore/vendor/bootstrap.bundle.min.js' %}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
