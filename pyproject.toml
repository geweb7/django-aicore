[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "django-aicore"
version = "0.1.2"
description = "Reusable Django app: AI providers by role, model calls, proxy pool, background tasks and call log UI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alex Haier" }]
keywords = ["django", "ai", "llm", "openai", "openrouter", "gemini"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "Django>=4.2",
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/geweb7/django-aicore"
Repository = "https://github.com/geweb7/django-aicore"

[tool.setuptools.packages.find]
include = ["django_aicore", "django_aicore.migrations"]

[tool.setuptools.package-data]
django_aicore = ["templates/**/*.html", "static/**/*.js"]
